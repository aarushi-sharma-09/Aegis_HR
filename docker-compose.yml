version: '3.8'

services:
  db:
    image: postgres:16
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegis_bgv
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aegis_bgv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aegis_pgdata:
